name: checks

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup_qwen.sh
      - run: bash -n start_qwen.sh
      - run: python3 -m py_compile run_server.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          foreach ($script in @("setup_qwen.ps1", "start_qwen.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - run: python -m py_compile run_server.py
